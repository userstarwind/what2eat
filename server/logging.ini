[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access,quizforge

[handlers]
keys=console,access_console

[formatters]
keys=default,access

[logger_root]
level=INFO
handlers=console

[logger_uvicorn]
level=INFO
handlers=console
qualname=uvicorn
propagate=0

[logger_uvicorn.error]
level=INFO
handlers=console
qualname=uvicorn.error
propagate=0

[logger_uvicorn.access]
level=INFO
handlers=access_console
qualname=uvicorn.access
propagate=0

[logger_quizforge]
level=INFO
handlers=console
qualname=src
propagate=0

[handler_console]
class=StreamHandler
level=NOTSET
formatter=default
args=(sys.stdout,)

[handler_access_console]
class=StreamHandler
level=NOTSET
formatter=access
args=(sys.stdout,)

[formatter_default]
class=uvicorn.logging.DefaultFormatter
format=%(asctime)s | %(levelname)s | %(name)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_access]
class=uvicorn.logging.AccessFormatter
format=%(asctime)s | %(levelname)s | %(name)s | %(client_addr)s - "%(request_line)s" %(status_code)s
datefmt=%Y-%m-%d %H:%M:%S
